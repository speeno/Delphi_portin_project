# ---------------------------------------------------------------
# 11. Phase 2 보강 — 모바일 메뉴 통합 (DEC-046)
# ---------------------------------------------------------------
# 본 섹션은 Sobo21 + Sobo48 의 phase2 변형(view 모드 / audit 비교)만 추가.
# 단일 원천: migration/contracts/_phase2_screen_to_contract_map.yaml
phase2_addendum:
  sales_statement_stock_prinjing:
    base_legacy: Sobo21
    dec: DEC-064
    label104_legacy: "Tong02.pas PrinJing → Sv_Ghng SUM(GsumX) by Bcode (창고 재고)"
    implemented: "2026-06-02 — prinjing_service.compute_warehouse_stock_qty; customer-preview bcode/ocode/hcode"
    regression_test: "test/test_sales_statement_stock_prinjing.py"
  transactions_status_view:
    base_legacy: Sobo21
    # 단일 진실: 기존 GET /api/v1/transactions/sales-statement 서비스 함수
    # (transactions_service.list_sales_statements / summarize_sales_statements_by_customer).
    # facade GET /api/v1/transactions/status 는 view 쿼리만 분기하는 얇은 래퍼이며
    # 동일 서비스 호출만 수행 (SQL/비즈니스 규칙 중복 0).
    canonical_endpoint: GET /api/v1/transactions/sales-statement
    facade_endpoint:    GET /api/v1/transactions/status
    permission: transactions.status.read   # 1차 RBAC 미적용 (DEC-016) — 인증만 요구
    query_params:
      shared:
        serverId: required string
        dateFrom: required ISO date (camelCase)   # snake_case dateFrom 도 허용
        dateTo:   required ISO date (camelCase)
        hcode:    optional — 출판사(Edit107) override only; 생략 시 Subu21 과 같이 JWT hcode 로 S1_Ssub 미필터
        includeCancelled: optional bool (default false — Yesno='2' 제외)
        limit:    optional int (1~500, default 50)
        offset:   optional int (>=0, default 0)
      facade_only:
        view: required enum[list, detail, summary, memo] (default list — 미지정 = list)
        memoLike: optional string (view=memo 한정, 본문 LIKE)
      sales_statement_phase2:    # canonical 직접 호출 시 동등 매핑
        memoPresence: optional enum[has_memo]  # view=memo 와 동등
        memoLike:    optional string
        includeMemoPreview: optional bool      # view=memo 는 자동 true
    response_variants:
      list:                       # view=list 또는 ?view 미지정 (facade)
        same_shape_as: SalesStatementListResponse
        items_extension:
          memo_preview: optional string (default "")   # 일반 LIST 에서는 빈 문자열
      detail:                     # view=detail (Sobo21_status_detail = 레거시 Sobo24 거래현황 상세)
        same_shape_as: SalesStatementListResponse        # 전표 단위 행 — list 와 동일 응답
        line_drilldown:
          # 행 펼침 시 프론트가 GET /sales-statement/{order_key} 라인 상세를 지연 조회.
          # 신규 백엔드 SQL 0 — get_sales_statement_detail 재사용 (DEC-040 정합, DRY).
          endpoint: GET /api/v1/transactions/sales-statement/{order_key}
          fields: [bcode, product_name, gsqut, gssum]
      summary:                    # view=summary
        wrapper: TransactionsStatusSummaryResponse
        items:
          - customer_code: string
            customer_name: string
            slip_count: int
            total_qty: int
            total_amount: int
        sort: amount_desc, customer_code asc (안정 정렬)
        truncated: bool (서버 cap BLS_TXN_STATUS_FETCH_MAX=5000 도달 시 true)
      memo:                       # view=memo
        same_shape_as: SalesStatementListResponse
        items_extension:
          memo_preview: required string (≤100자, 본문 첫 100자)
        filter: EXISTS S1_Memo (mysql3 호환 — 두 단계 fetch + Python 교집합)
    acceptance:
      - id: AC-INQ-P2-1
        description: "view=list 응답이 기존 Sobo21 거래명세서 1:1 매핑 (행 수·합계 ±0)"
        test: "test/test_c6_inquiry_phase2.py::test_view_list_equivalent"
      - id: AC-INQ-P2-2
        description: "view=summary 응답이 거래처 단위 합계 자기일관성 + amount_desc 정렬"
        test: "test/test_c6_inquiry_phase2.py::test_view_summary_aggregation"
      - id: AC-INQ-P2-3
        description: "view=memo 응답이 메모 보유 명세서만 반환 + memo_preview 채워짐"
        test: "test/test_c6_inquiry_phase2.py::test_view_memo_filter"
      - id: AC-INQ-P2-4
        description: "view 미지정 시 기본값 list (하위 호환)"
        test: "test/test_c6_inquiry_phase2.py::test_view_default_list"
      - id: AC-INQ-P2-5
        description: "view=memo + memoLike 키워드 부분일치 — 매칭되지 않는 행은 제외"
        test: "test/test_c6_inquiry_phase2.py::test_view_memo_like_filter"
      - id: AC-INQ-P2-6
        description: "canonical /sales-statement?memoPresence=has_memo 응답이 facade view=memo 와 동등"
        test: "test/test_c6_inquiry_phase2.py::test_canonical_memo_equivalent"
      - id: AC-INQ-P2-7
        description: "view=detail 응답이 view=list 와 동일 형태(전표 단위 행) — 상세 라인은 프론트 지연 조회"
        test: "test/test_c6_inquiry_phase2.py::test_view_detail_equivalent"

  audit_compare:
    base_legacy: Sobo48
    endpoint: GET /api/v1/ledger/comparison
    permission: ledger.audit.read
    blockers:
      - id: BLK-CMP-1
        description: "레거시 Sobo48 의 단일 SQL 미확정 — 거래처 ↔ 본사 장부 차액 알고리즘 합의 필요"
        owner: 델파이 담당자
        eta: 2026-Q2
    query_params:
      customer_code: required
      from_date: required ISO date
      to_date: required ISO date
    response:
      items:
        - txn_date: ISO date
          slip_no: string
          customer_amount: int
          house_amount: int
          difference: int
          reason: string | null
      summary:
        total_diff: int
    acceptance:
      - id: AC-CMP-1
        description: "BLK-CMP-1 해소 후 — difference = customer_amount - house_amount 자기일관성"
        test: "test/test_c6_audit_compare.py::test_diff_consistency"
        pending_blocker: BLK-CMP-1
