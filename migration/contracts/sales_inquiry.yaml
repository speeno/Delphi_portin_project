    web:
      method: SELECT
      table: S1_Ssub
      columns: ["*"]
      where:
        - "Gdate = :gdate"
        - "Hcode = :hcode"
        - "Jubun = :jubun"
        - "COALESCE(Gjisa,'') IN gjisa_lookup_variants(:gjisa)"
      order_by: ["Gcode", "Bcode"]
      bind: parameterized
    notes:
      - "라인 JSON: Gdang, Grat1, Yesno 노출. Subu21.dfm DBGrid101 '배송' 컬럼은 Title=배송, FieldName=Yesno(라인 플래그) — 웹 그리드 컬럼 '배송'은 yesno를 표시(2=취소 등)하며 물류 배송 추적 API와 별개."
    in_scope_phase1: true

