# ---------------------------------------------------------------
# 5. 엔드포인트 (웹)
# ---------------------------------------------------------------
endpoints:
  - method: GET
    path: /api/v1/transactions/sales-statement
    description: |
      거래명세서 목록 (Subu21 Button101Click 동등).
      UX(2026-06): DEC-064 §Idnum 정합 — 전표번호(idnum)+일자범위만으로 단건 조회 가능.
      idnum 비입력 시 jubun(=거래구분 차수)+일자로 N건 후보를 surface, 행 선택으로
      (Gdate,Gcode,Gjisa,Hcode,Idnum) 자동채움. GROUP BY 6축 (Gdate, Hcode, Idnum,
      Gubun, Jubun, Gjisa, Gcode) 로 1슬립=1행 보장.
    auth: bearer
    request:
      query:
        server_id: string
        hcode: string
        date_from: string
        date_to: string
        gcode?: string
        gjisa?: string
        jubun?: string
        idnum?: integer  # DEC-064 §Idnum 정합 — Subu21 Edit109 5자리 zero-pad
        note_idnum: "정수 매칭 (Subu21.pas Button901Click L924 'Idnum= @Idnum'). 단건 식별자."
        note_jubun: "거래구분 차수(2자리 hidden). 단독 검색은 다건 후보, 행 선택으로 idnum/gcode 확정"
        bcode?: string   # DEC-065 P4 — 거래현황(상세) Subu24 검색: 도서코드 라인 필터(S1_Ssub.Bcode 동등)
        pubun?: string   # DEC-065 P4 — 거래현황(상세) Subu24 검색: 도서구분 라인 필터(S1_Ssub.Pubun 동등)
        note_search_dialog: "bcode/pubun 은 라인 단위 동등 매칭(파생테이블 불요, mysql3 호환). FE 검색 다이얼로그 SalesStatementSearchDialog 전용 필터."
        include_cancelled?: boolean
        limit?: integer
        offset?: integer
    responses:
      "200":
        # DEC-024 (paging 표준): 신규 ``page`` 객체 + BC 평면 (deprecated, Phase 2 제거).
        body:
          items:
            - order_key:
                gdate: string
                hcode: string
                jubun: string
                gjisa: string
                idnum: integer
                gubun: string
                gcode: string
              customer_name: string
              row_count: integer
              qty: integer
              amount: integer
              status: "active|cancelled"
          page:
            limit: integer
            offset: integer
            total: integer
            has_more: boolean
          total: integer        # = page.total (BC, deprecated)
          limit: integer        # = page.limit
          offset: integer       # = page.offset
      "401": { body: { detail: "Invalid or expired token" } }

  - method: GET
    path: /api/v1/transactions/sales-statement/customer-preview
    description: |
      목록 참조 패널 — G1 프로필 + 당일 S1_Memo(Button301) + Label104 재고.
      stock_qty: Tong02 PrinJing(compute_warehouse_stock_qty) — query bcode+hcode+ocode 필수.
      명세 라인 클릭 시 해당 Bcode 로 온디맨드 재조회(실시간 재고).
    auth: bearer
    request:
      query:
        server_id: string
        gcode: string
        date_from: string
        date_to: string
        hcode?: string
        bcode?: string
        ocode?: string
        gubun?: string
        jubun?: string
        gjisa?: string
        idnum?: integer  # DEC-064 §Idnum 정합 — 단건 컨텍스트 메모 보강
    responses:
      "200":
        body:
          gcode: string
          customer_profile: { gname, gadd1, gadd2, address, phone, fax, gposa, gpost, gbigo, name1, remark1, remark2, customer_memo, customer_memo_html, customer_memo_format }
          stock_qty: integer|null
          memo_preview: { gbigo, sbigo, gtel1, gtel2, gname, gpost }
      "422": { body: { code: "INQ_VALIDATION" } }

  - method: GET
    path: /api/v1/transactions/sales-statement/{order_key}
    description: |
      거래명세서 상세 (라인 + 메모). DEC-064 §Idnum 정합 — 7세그먼트 합성키
      ``{gdate}|{hcode}|{jubun}|{gjisa}|{idnum}|{gubun}|{gcode}``. 4세그먼트(legacy)도
      backward-compat (idnum=0 fallback — 동일 jubun 다건 시 첫 행).
    auth: bearer
    request:
      path:
        order_key: "string ('{gdate}|{hcode}|{jubun}|{gjisa}[|{idnum}|{gubun}|{gcode}]')"
    responses:
      "200":
        body:
          order_key:
            gdate: string
            hcode: string
            jubun: string
            gjisa: string
            idnum: integer
            gubun: string
            gcode: string
          customer: { hcode: string, gname: string }
          slip_no: string  # DEC-064 — idnum 5자리 zero-pad ('00001'); idnum=0 이면 빈 문자열.
          status: "active|cancelled"
          lines: [...]
          memo: { gbigo, sbigo, gtel1, gtel2, gname, gpost }
      "404": { body: { detail: "Order not found", code: "INQ_NOT_FOUND" } }

  - method: PATCH
    path: /api/v1/transactions/sales-statement/{order_key}/memo
    description: "거래명세서 비고/연락처 갱신 (S1_Memo UPSERT, 단일 트랜잭션)."
    auth: bearer
    request:
      content_type: application/json
      schema:
        gbigo?: string
        sbigo?: string
        gtel1?: string
        gtel2?: string
        gname?: string
        gpost?: string
    responses:
      "200":
        body:
          order_key: { gdate, hcode, jubun, gjisa }
          action: "inserted|updated"
          updated_at: string
      "404": { body: { detail: "Order not found", code: "INQ_NOT_FOUND" } }
      "422": { body: { detail: "Validation failed", code: "INQ_VALIDATION" } }
      "500": { body: { detail: "Transaction failed (rolled back)", code: "INQ_TX_FAILED" } }

  # DEC-065 — 거래명세서 화면 내 신규추가 (Sobo21 Button201). 1차 거래구분 '출고' 고정.
  # 생성은 outbound_service.create_order 재사용(동일 S1_Ssub). 신규 SQL 표면 최소화(DEC-040 정합).
  - method: GET
    path: /api/v1/transactions/sales-statement/line-defaults
    description: |
      도서코드 자동조회 — Subu21.pas Button201Click(L568~630) + Tong02.pas PrinZing/PrinRat1 동등.
      단가·비율 4단 override(last-wins): G1_Ggeo(거래처 비율, Pubun 선택) → G4_Book(도서마스터 단가/비율)
      → G6_Ggeo(거래처×도서 특가) → S1_Ssub 직전거래가(G7_Ggeo.Chek3='grat1'|'grat2' 게이트).
      회사 컨텍스트(Hnnnn)=JWT scope hcode, customer=거래처코드(Edit104). 단일행 동등조회만(mysql3 호환).
    auth: bearer
    request:
      query:
        server_id: string
        bcode: string            # 도서코드 (S1_Ssub.Bcode)
        customer?: string        # 거래처코드 — G1/G6/직전거래가 조회 키
        pubun?: string           # 품목구분 (기본 '위탁') — 비율 컬럼 선택
        qty?: integer            # 입력 수량 — gssum 미리보기 계산용
        gjisa?: string           # 지사 — 직전거래가 지사 키 변형(특정 고객 DB)
    responses:
      "200":
        body:
          bcode: string
          product_name: string   # G4_Book.Gname
          gjeja: string          # G4_Book.Gjeja (저자)
          gdang: integer         # 단가 (S1_Ssub.Gdang)
          grat1: number          # 비율 % (Pubun 선택값)
          pubun: string
          gssum: integer         # qty 기준 계산금액 (없으면 0)
          source: string         # 결정 출처 (G1_Ggeo/G4_Book/G6_Ggeo/S1_Ssub:last)
          found: boolean
      "500": { body: { detail: "line-defaults query failed", code: "INQ_TX_FAILED" } }

  - method: POST
    path: /api/v1/transactions/sales-statement
    description: |
      거래명세서 출고 전표 생성. gubun='출고' 서버 강제(D2 1차). 전표번호(Jubun) 자동 채번.
      라인 금액(gssum)은 서버에서 PrinYing(= round(Gdang*Gsqut*Grat1/100)) 재계산·검증
      (클라이언트가 양수 금액을 보냈는데 ±1 초과 불일치 시 422). audit.outbound 'created'.
      라인 Gcode=거래처코드(Edit104)=header.hcode (Subu21 정합).
    auth: bearer
    request:
      content_type: application/json
      schema:
        serverId: string
        gdate: string            # 'YYYY-MM-DD' (저장 시 'YYYY.MM.DD')
        hcode: string            # 거래처코드 (S1_Ssub.Hcode/Gcode)
        gjisa?: string
        jubun?: string           # 생략 시 서버 자동 채번
        lines:
          - bcode: string
            pubun: string        # 기본 '위탁'
            gsqut: integer
            gdang: integer
            grat1: number
            gssum?: integer      # 0/생략 시 서버 계산값 채택
            gbigo?: string
    responses:
      "201":
        body:
          order_key: { gdate, hcode, jubun, gjisa }
          slip_no: string        # 채번된 Jubun
          lines: integer
          qty: integer
          amount: integer
          created_at: string
      "422": { body: { detail: "Validation failed", code: "INQ_VALIDATION" } }
      "500": { body: { detail: "Transaction failed (rolled back)", code: "INQ_TX_FAILED" } }

  - method: GET
    path: /api/v1/inventory/ledger
    description: |
      도서별 수불원장 (TSobo31 Button101→102/103 동등).
      DEC-033 (f) — 재고관리 메뉴(Sobo44_inv/Sobo33_ledger) 정책: hcode/bcode 옵셔널 +
      서버 LIMIT(BLS_INVENTORY_LEDGER_MAX, 기본 5,000행) + truncated 플래그.
      DEC-033 (g) — 일자(by_date) 누적 결과에 limit/offset 표준 페이지네이션 적용
      (7화면 공통 DataGridPager 호환). truncated 가드와 페이지 메타는 직교(독립).
    auth: bearer
    request:
      query:
        server_id: string
        hcode?: string             # DEC-033 (f) — 비우면 전체 거래처/지사
        date_from: string
        date_to: string
        bcode?: string             # DEC-033 (f) — 비우면 전체 도서
        bcode_to?: string
        scope?: "string ('A'|'B', default 'B')"
        limit?: "integer (default 100, ge=1, le=2000)"   # DEC-033 (g)
        offset?: "integer (default 0, ge=0)"             # DEC-033 (g)
    responses:
      "200":
        body:
          opening_date: string
          rows: [...]              # ledger_rows 스키마
          total: integer           # DEC-033 (g) — by_date 누적 행 수
          page:                    # DEC-024 / DEC-033 (g) — DataGridPager 표준
            limit: integer
            offset: integer
            total: integer
            has_more: boolean
          truncated: boolean       # DEC-033 (f) — LIMIT 가드 도달 시 true

  - method: GET
    path: /api/v1/reports/book-sales
    description: |
      도서별 판매 (TSobo61 Button101Click 동등) — C14 동등성 캡처 대상.
      DEC-033 (f) — Sobo33_1_ledger 통합 정책: hcode 옵셔널 (페이지네이션 가드 유지).
    auth: bearer
    request:
      query:
        server_id: string
        hcode?: string             # DEC-033 (f) — 비우면 전체 거래처 합계
        date_from: string
        date_to: string
        bcode_from?: string
        bcode_to?: string
        scope?: "string"
        # DEC-024 가상 페이징 — full aggregation 후 in-memory slicing.
        limit?: integer            # 기본 100, 최대 2000
        offset?: integer
    responses:
      "200":
        # DEC-024: ``page`` + BC ``total``. rows 는 limit 만큼만 반환.
        body:
          rows: [...]              # book_sales_rows 스키마 (slice 결과)
          page:
            limit: integer
            offset: integer
            total: integer         # 전체 집계 행 수
            has_more: boolean
          total: integer            # = page.total (BC)

  - method: GET
    path: /api/v1/reports/customer-sales
    description: "거래처 판매 (TSobo62 Button101Click 동등) — C14 동등성 캡처 대상."
    auth: bearer
    request:
      query:
        server_id: string
        hcode?: string
        date_from: string
        date_to: string
        scope?: "string ('X'|'Y'|'Z')"
        gcode_from?: string
        gcode_to?: string
        limit?: integer            # DEC-024 — 기본 100, 최대 2000
        offset?: integer
    responses:
      "200":
        body:
          rows: [...]              # customer_sales_rows 스키마 (slice 결과)
          page:
            limit: integer
            offset: integer
            total: integer
            has_more: boolean
          total: integer            # = page.total (BC)

# ---------------------------------------------------------------
# 6. 차이점·결정 사항 (Decision Log 후보)
# ---------------------------------------------------------------
deltas:
  - id: D-INQ-1
    title: 권한키 분기 (F24/F31/F61/F62) — 일반 권한 관리 (C10) 에 통합
    legacy_behavior: "Subu21/31/61/62 진입 시 Base10.Seek_Uses 로 화면 권한 검사."
    web_behavior_phase1: "JWT bearer 유효성만 검증. f-key 분기는 미적용."
    rationale: "C10 에서 통합 RBAC 구현. C2 D-OUT-1 패턴 그대로."
    decision_log: DEC-016         # 본 contract 가 신설 등록
    deferred_to: "C10"

  - id: D-INQ-2
    title: 인쇄 트리거 (Tong20.Srart_21_01 / Srart_31_01 / Srart_61_01) — 후속 C7
    legacy_behavior: "조회 후 자동/수동으로 인쇄 양식 호출."
    web_behavior_phase1: "응답에 print_url 미포함. 프론트는 인쇄 버튼 미노출."
    rationale: "DEC-004 — 인쇄는 C7 에서 HTML+PDF 하이브리드로 일괄 처리."
    decision_log: DEC-017
    deferred_to: "C7"

  - id: D-INQ-3
    title: 바코드 진입 (Tong08) — 후속 C8
    legacy_behavior: "Sobo21/31 에서 바코드 입력으로 매칭 SELECT."
    web_behavior_phase1: "바코드 keydown 핸들러 미적용."
    decision_log: DEC-018
    deferred_to: "C8"

  - id: D-INQ-4
    title: Sobo62 H1_Ssub 입출금 sub-query — 후속 C5 정산
    legacy_behavior: "Subu62.pas L421~ — Sub-query 로 입금/출금 합산."
    web_behavior_phase1: "응답 스키마는 유지하되 gosum/gbsum 0 으로 채움 (UI 컬럼은 표시)."
    rationale: "정산 흐름은 C5 에서 일괄 — 본 화면은 매출 합계만."
    deferred_to: "C5"

  - id: D-INQ-5
    title: SQL 별칭 컨벤션 — `lines` / `LINES` 금지
    legacy_behavior: "(없음 — 레거시는 alias 사용 안 함)"
    web_behavior_phase1: "COUNT(*) 별칭은 `row_count` 사용. 일부 MySQL 의 LOAD DATA `LINES` 예약어와 충돌하는 별칭 일체 금지."
    rationale: "C2 핫픽스 HOT-OUT-1 일반화 — 모든 시나리오 컨벤션."
    decision_log: "(C2 HOT-OUT-1 참고 — 본 contract 는 신규 DEC 불요)"

# ---------------------------------------------------------------
# 7. 동등성 (5축) — 베타 임계값
# ---------------------------------------------------------------
equivalence:
  functional:
    threshold: "정상·경계·실패 7건 모두 PASS (test/test_c6_inquiry_phase1.py)."
  data:
    threshold: "5건 캡처 raw row 100% 일치 (4 화면 × 평균 1.25건)."
    method: "동일 server_id 에서 레거시 SELECT 캡처(JSON) ↔ 웹 응답 row 정렬 후 deep-equal."
    notes:
      - "Sobo61/62 의 Sum(Gsqut)/Sum(Gssum) 가 핵심 (C14 동등성)."
      - "Sobo21 메모 UPSERT 후 SELECT 결과가 PATCH 입력과 일치."
  ui:
    threshold: "4 화면 모두 ① 기본 기간(오늘) 자동 채움 ② 그리드 컬럼 한글 라벨 100% 매핑 ③ 페이지네이션 next/prev 동작."
  audit:
    threshold: "메모 PATCH 1건마다 audit_log 1건 (C2 audit_service 재사용)."
  performance:
    threshold: "1만 행 응답 P95 < 800ms (페이지네이션 limit 100 기본)."

# ---------------------------------------------------------------
# 8. 고객사 변형 (DEC-019/028 정책 — variant 부재 단언)
# ---------------------------------------------------------------
customer_variants:
  policy: |
    DEC-019 (variant 통합 정책) + DEC-028 (dfm 산출물 의무 입력) 그대로 재사용.
    본 contract 의 4폼은 dfm/pas 변형(고객사별 분기)이 발견되면 본 섹션에 추가하고,
    UI/SQL 분기를 코드에 두지 않으며 데이터/feature flag 로 흡수한다.
  variants:
    - id: chul_09_warehouse_subu21
      database: chul_09_db
      account_types: [T3]
      account_family: chul_09
      legacy_source: WeLove_FTP/도서유통-출판/MySQL/도서유통/chul_09(위러브)/Subu21.pas
      diffs:
        - field: S1_Ssub.Hcode
          default_subu21: "Edit107 (출판사, 빈 값 가능)"
          chul_09: "Hnnnn (세션 JWT scope, 예 교문사 5019)"
          modern: "LIST 쿼리 hcode 미전달 시 T3·chul_09 는 JWT scope 주입"
        - field: S1_Ssub.Ocode
          default_subu21: "B (지사 출고)"
          chul_09: "A (FormShow 캡션 거래명세서-(창고))"
          modern: "sales_statement_ocode_sql(server_id)"
        - field: H2_Gbun.Hcode
          default_subu21: "gcode 9* 만 scope, 그 외 ''"
          chul_09: "항상 Hnnnn"
          modern: "resolve_h2_hcode_for_customer"
        - field: Yesno
          default_subu21: "SELECT 에 Yesno 없음"
          chul_09: 동일
          modern: "chul_09_db 는 HAVING 취소 제외 없음(레거시 그리드 동일)"
  verification:
    - form: Subu21
      legacy_inventory: legacy_delphi_source/legacy_source/Subu21.{pas,dfm}
      generated_inventory: tools/delphi_porting_accelerator/examples/generated/legacy_source_root/Subu21/
      result: "variant 폴더 0건 (Subu21_*, Subu21_1 등 부재) — UI/로직 variant 0건 확인됨."
    - form: Subu31
      legacy_inventory: legacy_delphi_source/legacy_source/Subu31.{pas,dfm}
      generated_inventory: tools/delphi_porting_accelerator/examples/generated/legacy_source_root/Subu31/
      result: "variant 폴더 0건 — UI/로직 variant 0건 확인됨."
    - form: Subu61
      legacy_inventory: legacy_delphi_source/legacy_source/Subu61.{pas,dfm}
      generated_inventory: tools/delphi_porting_accelerator/examples/generated/legacy_source_root/Subu61/
      result: "variant 폴더 0건 — UI/로직 variant 0건 확인됨."
    - form: Subu62
      legacy_inventory: legacy_delphi_source/legacy_source/Subu62.{pas,dfm}
      generated_inventory: tools/delphi_porting_accelerator/examples/generated/legacy_source_root/Subu62/
      result: "variant 폴더 0건 — UI/로직 variant 0건 확인됨."
  future_policy: |
    향후 variant 가 발견되면:
      1) 본 variants 배열에 form/diff/diff_lines 항목 추가.
      2) dfm 차이가 0행이면 UI 분기 0, pas 차이만 데이터/설정으로 흡수.
      3) dfm 차이가 있으면 layout_mappings 노트 §9 에 차이 표 추가, contract 에는 분기 옵션만.
    어떤 경우에도 컴포넌트 코드에 if (customer === 'X') 류 분기 0건 유지 (DEC-019).

