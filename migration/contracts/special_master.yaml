# Migration Contract: 특별관리 Sobo16 — G6_Ggeo (Phase 1)
#
# 출처(레거시):
#   - legacy_delphi_source/legacy_source/Subu16.pas (조회·그리드)
#   - legacy_delphi_source/도서유통-New/도서유통/한국도서유통/출판/Base01.pas
#     TBase10.T1_Sub61BeforePost / T1_Sub62BeforePost (INSERT/UPDATE G6_Ggeo)
#
# 정정 (2026-04-26): 초안의 「G1_Ggeo Special_flag / 분류」 모델은 Sobo16 코드와 불일치.
#   레거시 저장 대상은 G6_Ggeo 의 Grat1·Gssum(및 키 Hcode,Gcode,Bcode,ID) 뿐.
#   거래처 마스터 플래그가 필요하면 별도 화면·계약으로 분리한다.

id: C9-special-master
name: 특별관리 (Sobo16 — 출판사·거래처·도서 링크 G6_Ggeo)
version: 1.3.0
status: active
scope_phase: phase1
created: 2026-04-21
updated: 2026-08-18
owner: 메인개발자

references:
  - analysis/screen_cards/Sobo16.md
  - analysis/layout_mappings/Sobo16.md
  - migration/contracts/master_data.yaml
  - docs/welove-publish-schema-dictionary.md  # G6_Ggeo

constraints:
  new_sql_count: 0
  external_integrations: excluded

blockers: []

out_of_scope:
  - Gcode/Bcode 변경 저장

intent: |
  출판사(Hcode) 단위로 거래처(Gcode)·도서(Bcode) 간 G6_Ggeo 링크를 조회하고,
  레거시와 동일하게 신규/수정/삭제(Grat1/Gssum 포함)를 수행한다.
  표시명은 G4_Book·G1_Ggeo 조인(또는 동등 룩업)으로 보강한다.

legacy_write_sql: |
  INSERT INTO G6_Ggeo (Hcode, Gcode, Bcode, Grat1, Gssum) VALUES (...);
  UPDATE G6_Ggeo SET Gcode=..., Bcode=..., Grat1=..., Gssum=... WHERE ID=... AND Hcode=...;
  (소스: 도서유통-New/.../Base01.pas T1_Sub61BeforePost — 모던 1차 PATCH 는 Grat1/Gssum 만)

scope:
  list:
    path: GET /api/v1/masters/special
    legacy_id: Sobo16
    permission: master.special.read
    query_params:
      serverId: required
      mode: enum [customer, book, publisher]
      hcode: required (출판사 코드)
      gcode: optional — mode=customer 일 때 거래처 코드
      bcode: optional — mode=book 일 때 도서 코드
      limit: { default: 100, max: 500 }
      offset: default 0
    response:
      items:
        - id: int
          hcode: string
          gcode: string
          bcode: string
          grat1: string
          gssum: number
          bname: string
          gname: string
      page: { limit, offset, total, has_more }

  create_row:
    path: POST /api/v1/masters/special
    legacy_id: Sobo16
    permission: master.special.write
    request_body:
      serverId: required
      hcode: required
      gcode: required
      bcode: required
      grat1: optional string
      gssum: optional number

  patch_row:
    path: PATCH /api/v1/masters/special/{id}
    legacy_id: Sobo16
    permission: master.special.write
    request_body:
      serverId: required
      hcode: required
      grat1: optional string
      gssum: optional number
    notes: |
      1차는 Grat1/Gssum 만 변경.
      레거시는 Gcode/Bcode 갱신도 지원하나 웹은 키 변경 없이 유지한다.

  delete_row:
    path: DELETE /api/v1/masters/special/{id}
    legacy_id: Sobo16
    permission: master.special.write
    query_params:
      serverId: required
      hcode: required

acceptance_criteria:
  - id: AC-SPC-G6-1
    description: "list(customer/book/publisher) 가 G6_Ggeo 행을 페이징 반환"
    test: "test/test_masters_special_g6.py"
  - id: AC-SPC-G6-2
    description: "PATCH 후 동일 키로 조회 시 grat1/gssum 반영"
    test: "test/test_masters_special_g6.py"
  - id: AC-SPC-G6-3
    description: "mysql3 서버에서 LIMIT 바인딩 순서 회귀 없음"
    test: "test/test_masters_special_g6.py"
  - id: AC-SPC-G6-4
    description: "POST 중복키(Hcode/Gcode/Bcode) 충돌 시 MASTER_DUPLICATE"
    test: "test/test_masters_special_g6.py"
  - id: AC-SPC-G6-5
    description: "DELETE 후 동일 ID 재조회 시 not found"
    test: "test/test_masters_special_g6.py"

decisions:
  - DEC-019
  - DEC-023
  - DEC-033
  - DEC-040
  - DEC-041
  - DEC-046
  - DEC-171

# ---------------------------------------------------------------------------
# DEC-171 (2026-08-18) — 계정(빌드)별 특가 비율 프로필. 코드 분기 없이 본 데이터로만 분기한다.
#   single   : 총판 빌드 원형(도서유통-총판 Subu16/Base01) — 비율 1개(Grat1)+단가(Gssum), 출고 적용 = Grat1.
#   by_pubun : 출판/자체물류 빌드(도서유통-New Subu16 + Tong02.PrinRat1) — 판매유형별 Grat1~6 + 단가,
#              출고 적용 = 전표 판매유형(Pubun) 별 컬럼(위탁·신간·반품→Grat1, 현매→Grat2, 매절→Grat3,
#              납품→Grat4, 특별→Grat5, 한도→Grat6, 증정→0). '기타' 는 레거시 PrinRat1 에 분기가 없어
#              Grat1 이 남던 quirk 대신 그리드 라벨(기타=Grat6) 대로 Grat6 을 적용한다(DEC-171 명시 결정).
#              판매유형 컬럼이 0(미입력)이면 특가 위탁율(Grat1)로 폴백 — 레거시는 0 을 그대로 썼지만 웹 기존
#              특가 행은 Grat1 만 채워져 있어 0% 전표를 만들지 않기 위한 명시 결정(DEC-171).
# 백엔드 런타임은 허브 본 파일 → 백엔드 번들 사본(backend/data/contracts/special_master.yaml) 순으로 읽는다.
rate_profiles:
  single:
    label: "비율 1개 (총판)"
    columns: [grat1]
    column_labels: { grat1: "비율" }
    apply: grat1
  by_pubun:
    label: "판매유형별 (출판/자체물류)"
    columns: [grat1, grat2, grat3, grat4, grat5, grat6]
    column_labels: { grat1: "위탁", grat2: "현매", grat3: "매절", grat4: "납품", grat5: "특별", grat6: "기타" }
    apply: by_pubun
    pubun_column: { 위탁: grat1, 질: grat1, 신간: grat1, 반품: grat1, 현매: grat2, 매절: grat3, 납품: grat4, 특별: grat5, 한도: grat6, 기타: grat6, 증정: none }

customer_variants:
  - id: default-distributor
    description: "총판 계정(및 매칭 없는 기본값) — 총판 빌드 원형"
    match: {}
    rate_profile: single
  - id: publisher-builds
    description: "교문사 등 독립 출판사·자체물류 출판사 계정 — 도서유통-New/출판 빌드"
    match:
      build_role: [publisher, warehouse_publisher]
    rate_profile: by_pubun
