# Hcode Query 처리 정책 — 모든 도메인 contract 의 GET 엔드포인트가 참조해야 하는
# 단일 정본 (ACC-DATA-03 / DEC-033 f / M4 — 2026-05-25 적용).
#
# 본 yaml 자체는 라우터/계약을 정의하지 않는다.
# `migration/contracts/<domain>.yaml` 에서 ``hcode_query_policy: <tag>`` 키로
# 본 표의 태그를 인용해 사용한다.
#
# 산출물:
# - 인벤토리: [`analysis/hcode_screen_api_inventory.md`](../../analysis/hcode_screen_api_inventory.md)
# - 헬퍼:    [`도서물류관리프로그램/backend/app/core/deps.py::enforce_hcode_isolation`](../../도서물류관리프로그램/backend/app/core/deps.py)
# - 감사:    [`tools/audit_router_hcode_coalesce.py`](../../tools/audit_router_hcode_coalesce.py)
# - 회귀:    [`test/test_routers_hcode_coalesce.py`](../../test/test_routers_hcode_coalesce.py),
#            [`test/test_hcode_isolation_enforce.py`](../../test/test_hcode_isolation_enforce.py)
#
# 표기 약속: ✓=강제 / —=무필터 / ⚠=명시 hcode 검사 후 통과 또는 403 `HCODE_FORBIDDEN`.

version: "2026-05-29"
policy_tags:
  coalesce_jwt:
    description: |
      쿼리 ``hcode`` 가 비면 JWT scope hcode 를 자동 주입.
      T2_PUB / T3 공유 DB(chul_09) 에서는 빈 hcode 도 본인 hcode 로 강제.
      T2_DIST / T1 / super 는 빈 hcode = 무필터(전체 조회).
      명시된 hcode 가 본인 scope 와 다르면 403 ``HCODE_FORBIDDEN``.
    applies_to:
      - hcode 검색 UI 가 있는 list/집계 GET 엔드포인트
    backend_helper: app.core.deps.enforce_hcode_isolation
    account_matrix:
      T1: "—"
      T2_DIST: "—"
      T2_PUB: "✓ (JWT 자동 주입)"
      T3: "—"
      T3_LITE: "✓ (chul_09 SKU)"
      T3_FULL_NEW: "✓"
      T3_FULL_LABEL: "—"
    references:
      - "[DEC-033 (f)](../../legacy-analysis/decisions.md)"
      - "[ACC-DATA-03](../../docs/onboarding-rbac-menu-matrix.md)"

  optional_wide:
    description: |
      ``coalesce_jwt`` 와 동일 코드 경로지만 정책 매트릭스상 격리 강제 안 함.
      (총판/수퍼 운영 — 빈 hcode = 전체 조회 의도)
    backend_helper: app.core.deps.enforce_hcode_isolation
    account_matrix:
      T1: "—"
      T2_DIST: "—"
      T2_PUB: "(미적용)"
      T3: "—"

  implicit_scope:
    description: |
      쿼리 ``hcode`` 자체를 받지 않는 마스터/자동완성류.
      라우터가 항상 ``resolve_scope_hcode(ctx)`` 적용 — UI 입력 무관.
    backend_helper: app.core.hcode_isolation.resolve_scope_hcode
    references:
      - "[masters_service.py](../../도서물류관리프로그램/backend/app/services/masters_service.py)"

  key_identity:
    description: |
      ``hcode`` 가 합성키의 일부(order_key/return_key/billing_key 등 단건 키 처리).
      coalesce 미적용 — 식별자 자체가 키의 일부라 격리 의미 없음.
    notes:
      - "예: order_key/return_key/billing_key 의 PATCH/POST"

  scope_identity:
    description: |
      ACC-DATA-03 보강(2026-05-29) — ``hcode`` 동등 식별자/범위/패턴을 Query/Body 로
      받는 우회 경로. 격리 계정은 빈 값=본인 hcode 강제, 타사 값=403 ``HCODE_FORBIDDEN``.
      T2_DIST/T1/super 는 입력 그대로(광역).
      단건: ``enforce_hcode_identity`` / 구간: ``enforce_hcode_range`` /
      패턴: ``enforce_hcode_pattern`` (모두 app.core.deps).
    applies_to:
      - 식별자 파라미터(customerCode, hcodeFrom~hcodeTo, body hcode 등)로 Hcode 를
        직접 필터하는 GET/POST/PATCH 엔드포인트
    backend_helper: app.core.deps.enforce_hcode_identity
    account_matrix:
      T1: "—"
      T2_DIST: "—"
      T2_PUB: "✓ (본인 강제, 타사 403)"
      T3: "—"
      T3_LITE: "✓ (chul_09)"
    references:
      - "[ACC-DATA-03](../../docs/onboarding-rbac-menu-matrix.md)"
      - "[test/test_hcode_identifier_guards.py](../../test/test_hcode_identifier_guards.py)"
      - "[test/test_ledger_courier_scan_hcode_isolation.py](../../test/test_ledger_courier_scan_hcode_isolation.py)"

  scope_runtime_guard:
    description: |
      최후 방어선(2026-05-29) — multi-tenant 테이블을 scope 없이 조회하는 회귀를
      요청 범위 ContextVar 로 런타임 검출. ``BLS_HCODE_SCOPE_GUARD=strict`` 면
      ``RuntimeError``, 기본 warn 이면 ``audit.hcode_scope`` 로그.
    backend_helper: app.core.hcode_isolation.guard_scope_bound
    notes:
      - "append_hcode_clause(guard=True) 에 기본 내장; ledger 통합/출판사설정 직접 호출."

# 도메인 contract → 정책 매핑 (선언적 색인)
