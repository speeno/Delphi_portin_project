# Migration Contract: 기초 마스터 단일 원천 (C9) — Wave A/B/C
#
# 본 계약은 레거시 Sobo11/14/17/38/39 의 단일 원천 매핑(DEC-023)을 웹 API+UI
# 에서 동등하게 노출하기 위한 1차 계약입니다. Sobo36/37/43 은 통계 화면으로 분리됨.
#
# 단일 원천 (DEC-023):
#   - Sobo11 → 거래처(G1_Ggeo + G1_Gbun)            ✅ Wave A 풀 (CRUD API)
#   - Sobo14 → 도서  (G4_Book + G4_Gbun)             ✅ Wave A 풀 (CRUD API)
#   - Sobo17 → 출판사·G7거래처(G7_Ggeo + G7_Gbun)    ✅ v1.4.0 CRUD API (POST/PATCH/DELETE)
#   - Sobo38 → 도서코드 (G4_Book)                   ✅ v1.4.0 CRUD = /masters/book thin alias
#   - Sobo39 → 할인율 (G7_Ggeo Gpper 계열)          ✅ v1.4.0 CRUD + variant=base|v1|v2|v5 (컬럼 존재 시)
#
# 정정 (2026-04-23, v1.2.0): 「Sobo45 → 물류비 (G5_Ggeo.Gposa)」 매핑 제거.
#   레거시 Subu45.dfm Caption='청구서관리' (TSobo45) 가 실제 정의이며,
#   청구서관리는 ``Sobo45_billing`` (folder=Subu45, route=/settlement/billing) 으로
#   별도 정상 등록되어 있음(C5 정산 phase1, return_receipt.yaml/billing 계약 측 보유).
#   G5_Ggeo.Gposa 는 청구서관리 화면 내부 inline lookup (레거시 Subu45.pas
#   ``G5_Ggeo.Locate`` 패턴) 으로 흡수. 단독 마스터 화면은 레거시에 부재.
#   사용자 룰 — 임시방편 금지·일반화 해결·이전 케이스(Sobo45_billing) 우선 활용.
#
# 1차 미접근 (후속):
#   - Sobo15(입고처) — Sobo11 과 동일 G1_Ggeo 분기, Phase 2 통합 후보
#   - 자동완성(GET /masters/customers, /products) 은 C2 contract 에서 보존, 본 계약은 영향 0

id: C9-master-data
name: 기초 마스터 단일 원천 (Sobo11/14/17/38/39)
version: 1.5.5
status: draft
scope_phase: phase1
# Changelog
#   v1.5.5 (2026-05-31) — Sobo13 목록 검색 필터(minimal): GET /masters/authors 에
#                        gubun(저자구분 정확일치)·workplace(직장명 LIKE)·q(Gcode/Gposa/Gname).
#                        AuthorListItem(gposa/gbun_name/직장/전화/등록일/직책), G3_Gbun 조인.
#                        회귀 test_author_list_filters.py + Sobo13.md §3.1.
#   v1.5.4 (2026-05-31) — Sobo13 저자구분 Sobo11/Sobo14 패턴 통합: Edit101 MasterGbunSelect(G3_Gbun only),
#                        dual-join+gbun_orphan, 분류 CRUD 상세/신규 접기(목록 탭 제거).
#   v1.5.3 (2026-05-31) — Sobo14 목록 검색 필터 확장(minimal): GET /masters/book 에
#                        gubun(분류 정확일치)·jubun(도서처리 LIKE)·excludeShippingStop(출고정지 제외)
#                        추가. WHERE/COUNT 동일 합성. 회귀 test_book_list_filters.py + Sobo14.md §3.1.
#   v1.5.2 (2026-05-31) — Sobo14 도서분류 Sobo11 패턴 통합: Edit101 MasterGbunSelect(G4_Gbun only),
#                        dual-join+gbun_orphan, 분류 CRUD 상세/신규 접기(목록 탭 제거), sname denorm.
#   v1.5.1 (2026-05-31) — Sobo11 목록 검색 필터 확장(minimal): GET /masters/customer 에
#                        gubun(구분 정확일치)·jubun(지역 LIKE)·excludeTerminated(거래종료 제외)
#                        추가. WHERE/COUNT 동일 합성으로 페이지·total 정합. 회귀
#                        test_customer_list_filters.py + Sobo11.md §3.1.
#   v1.5.0 (2026-05-30) — Sobo11 상세 폼 필드 확장(gubun/jubun/ocode/연락처/비율/계산서/
#                        출고정지 등) + G1_Gbun 거래처구분 CRUD 추가
#                        (/api/v1/masters/customer-categories). 프론트 분리 라우트(목록/상세/신규).
#                        Edit101 MasterGbunSelect + 구분 CRUD를 상세/신규에 통합(목록 탭 제거).
#   v1.4.0 (2026-05-08) — Sobo17/38/39 쓰기 풀. 출판사 G7_Ggeo POST/PATCH/DELETE,
#                        도서코드는 G4_Book 기존 book CRUD thin alias (/masters/book-code/*),
#                        할인율 G7_Ggeo Gpper·Gpper1/2/5 (SHOW COLUMNS 존재 시) + ?variant=.
#                        DEC-019: 본 3폼만 INSERT/DELETE 허용 — 그 외 마스터는 기존 정책 유지.
#   v1.3.0 (2026-04-29) — CRUD 갭 축소. Sobo11/Sobo14 에 POST/DELETE API 추가
#                        (customer/book create/delete), audit.master action=create/delete,
#                        회귀 test_master_crud_api_contract.py.
#   v1.2.0 (2026-04-23) — 매핑 추정 오류 정정. 「Sobo45 → 물류비 (G5_Ggeo.Gposa)」
#                        catalog 행 + endpoints[SQL-MAS-10] + customer_variants[Sobo45]
#                        제거. 근본 원인: v1.0.0 Wave A/B/C 초기 catalog 작성 시
#                        G5_Ggeo.Gposa 컬럼만 보고 Subu45.dfm Caption 미확인 →
#                        실제 Caption='청구서관리' (Sobo45_billing 으로 별도 정상 등록).
#                        프론트 라우트 /master/logistics-cost · 페이지 · master-api
#                        logisticsCostList · 백엔드 /api/v1/masters/logistics-cost ·
#                        masters_service.list_logistics_costs · models LogisticsCost*
#                        동시 제거. 회귀 가드: test_masters_q_search /
#                        test_pagination_contracts / test_list_state_persistence_audit
#                        에서 logistics-cost 항목 제거 + form-registry / contract /
#                        page 매핑 부재 단언 신규.
#   v1.1.0 (2026-04-19) — DEC-028 retrofit. customer_variants(Subu14_1/Subu17_1/Subu38_1/Subu38_2/Subu45_1
#                        4폼 변형 폴더 사실 + Subu11/Subu39 변형 0건 단언) + out_of_scope(OOS-MAS-1~5:
#                        admin Wave D DFM 부재 / Sobo36/37/43 통계 분리 / 마스터 CREATE·DELETE /
#                        자동완성 별 트랙 / Subu39_* accelerator 미생성). endpoints/schemas/data_access 변경 0.
#   v1.0.0 (2026-04-18) — Wave A/B/C 초기 contract.
acceptance_goal: |
  웹 사용자가 기초관리 메뉴에서 거래처/도서/출판사/도서코드/할인율을 조회 가능하고,
  거래처·도서·출판사(G7)·도서코드(book-code alias)·할인율에 생성/수정/삭제 API가 가능해야 한다.
  모든 write 는 audit.master 로거에 actor/entity/target/updated_fields 1줄 JSON 으로 기록된다.
  DEC-019 보강(v1.4.0): INSERT/DELETE 허용 범위를 Sobo17·Sobo38(=G4_Book)·Sobo39 로 한정.
  그 외 마스터(Sobo15 등) 및 Wave D 경계는 기존 DEC-019·DEC-023 유지.
  「물류비」 화면은 본 계약에서 제외 — 청구서관리(Sobo45_billing, 별도 계약) 내부에서
  G5_Ggeo.Gposa lookup 으로 흡수 (v1.2.0 정정).

owners:
  business: 메인개발자
  legacy: 델파이 담당자
  web: 웹 포팅 팀

decisions:
  - id: DEC-023
    title: C9 마스터 단일 원천 확정
    summary: |
      Sobo11/36, 14/37, 17/43 중복 후보 중 화면카드 분석에 따라 CRUD 풀세트 폼만 1차 채택.
      통계 화면(Sobo36/37/43) 은 사이드바 라벨에 "(통계)" 표기로 구분.
  - id: DEC-019
    title: 환경설정 경계 (Sobo19 vs Wave D)
    summary: |
      Sobo19 = 레거시 비즈니스 옵션. Wave D 의 application_settings 와 분리.
      기본 마스터 정책: «수정 ON, 삭제 OFF». v1.4.0 예외 — Sobo17(G7_Ggeo)·Sobo38(G4_Book alias)·
      Sobo39(G7_Ggeo Gpper 계열) 에 한해 POST/DELETE 허용. 그 외 마스터·Sobo15 등은 예외 없음.
  - id: DEC-024
    title: list 응답 paging 표준 (C2/C6/C9 + 후속 공통)
    summary: |
      모든 list 응답은 ``{items, page:{limit, offset, total, has_more}}`` 컨벤션을 따른다.
      C9 마스터 6개는 신규 표준이므로 BC 평면 필드를 노출하지 않는다 (page 단독).
      C2/C6 list/report 는 1차 BC 로 ``total/limit/offset`` 평면도 함께 보존 (Phase 2 deprecation).
      기본 limit=100, ceil=500 (마스터/리스트), ceil=2000 (집계 리포트), 자동완성은 별도 ceil=200 유지.
      구현 헬퍼: ``app/core/pagination.py`` (clamp_limit / clamp_offset / build_page / with_page).
  - id: DEC-026
    title: 마스터 list PK NULL/빈 row 가드 + DataGrid rowKey 안전 폴백
    summary: |
      5 종 마스터 list (customer/book/publisher/book-code/discount; v1.2.0 정정 — 구
      logistics-cost 제외) 에서 PK 컬럼(``Gcode``) 이 NULL 또는 빈 문자열인 row 가 ORDER BY Gcode
      정렬 상단에 몰려 화면이 "빈 행" 으로 보이고 React rowKey 중복 경고를
      유발하는 사용자 보고에 대응.
      1) backend ``masters_service._build_master_where`` 헬퍼 신설 — 모든
         마스터 list 가 ``Gcode IS NOT NULL AND Gcode <> ''`` PK 가드를
         자동 통과 (DRY/OCP — 6 곳 단일 호출). 검색 컬럼만 호출자에서 명시.
      2) frontend ``DataGrid`` 의 row 렌더러를 ``renderBodyRows`` 로 추출,
         호출자 ``rowKey`` 가 빈 문자열/NULL/중복을 반환해도 index 합성으로
         React duplicate key warning 을 차단 (LSP — 컴포넌트는 호출자
         입력이 깨져도 안전 동작해야 함). 5 마스터 + outbound + sales-statement
         + reports 2 등 DataGrid 사용 모든 화면 자동 보호 (v1.2.0 정정 — 구
         6 마스터 중 logistics-cost 제외).
      3) 회귀 가드 — ``test/test_masters_q_search.py`` MasterPkGuard 10 subtest
         (5 마스터 × 빈/non-empty q 매트릭스 + 헬퍼 단위; v1.2.0 정정).
  - id: DEC-025
    title: 마스터 q 검색 회귀 가드 + 동적 페이저
    summary: |
      DEC-024 직후 5 종 마스터 list 의 q 검색 회귀 핫픽스 (v1.2.0 정정 — 구 6 종 중 logistics-cost 제외).
      1) ``app/core/db._escape_mysql3_value`` — int/float/bool 은 quote 없이 인라인.
         (MySQL 3.x ``LIMIT 'N' OFFSET 'M'`` 거부 → root cause #1 해결).
      2) ``masters_service._likify`` 헬퍼로 6 개 list 의 LIKE 패턴 생성을 단일화.
         와일드카드(% _ \\) literal escape, 후속 charset 가드(BINARY/COLLATE) 도입 시
         이 한 곳만 보강 (SOLID OCP).
      3) ``BLS_DEBUG_MASTER_SEARCH=1`` 게이트로 q raw bytes / pattern / SQL / params 캡처.
         진단 보조 스크립트: ``debug/diagnose_master_search.py``.
      4) 회귀 가드: ``test/test_masters_q_search.py`` — 빈/ASCII/한글 q × 5 마스터 = 15 케이스
         + db escape 단위 (v1.2.0 정정 — 구 6 마스터 18 케이스 중 logistics-cost 3건 제외).
      5) 프론트 ``DataGridPager`` 에 「자동(N)」옵션 + ``useDynamicPageSize`` 훅 (ResizeObserver +
         localStorage 수동 우선) 으로 viewport 기반 page size 추천 — 8 개 list 화면 적용.

endpoints:
  # 거래처 (Sobo11)
  - id: SQL-MAS-1
    method: GET
    path: /api/v1/masters/customer
    query:
      - { name: serverId, type: string, required: true }
      - { name: q, type: string, required: false, note: "Gcode/Gname LIKE %q%" }
      - { name: gubun, type: string, required: false, note: "거래처구분 정확일치 (G1_Gbun.Gcode) — minimal 필터 2026-05" }
      - { name: jubun, type: string, required: false, note: "지역 LIKE %jubun% (G1_Ggeo.Jubun)" }
      - { name: excludeTerminated, type: bool, default: false, note: "거래종료 제외 — Gname NOT LIKE '[X]%' AND IFNULL(Gubun,'')<>'X 거래종료'" }
      - { name: limit, type: int, default: 100, max: 500, note: "DEC-024 표준" }
      - { name: offset, type: int, default: 0 }
    response:
      content_type: application/json
      schema_ref: backend/app/models/master.py#CustomerListResponse
      shape: "{ items: [...], page: { limit, offset, total, has_more } }  # DEC-024"
    # DEC-RBAC-01 후속: 권위 사전(SCH-WELOVE-출판-G1_Ggeo) 기준 주소 컬럼은 ``gadd1`` + ``gadd2``.
    # 레거시 일부 변형 빌드에 ``Gjuso`` 가 보고된 기록이 있어 정정. 한글 주소는 두 컬럼 합성으로 노출.
    legacy_sql: "SELECT Gcode,Gname,Hcode,Gtel1,Gtel2,Gpost,Gadd1,Gadd2 FROM G1_Ggeo WHERE ... ORDER BY Gcode LIMIT %s OFFSET %s"
  - id: SQL-MAS-2
    method: GET
    path: /api/v1/masters/customer/{gcode}
    response:
      schema_ref: backend/app/models/master.py#CustomerDetailResponse
  - id: SQL-MAS-3
    method: PATCH
    path: /api/v1/masters/customer/{gcode}
    request:
      body_ref: backend/app/models/master.py#CustomerUpdateRequest
    response:
      schema_ref: backend/app/models/master.py#CustomerUpdateResponse
    audit:
      logger: audit.master
      record_keys: [timestamp, gcode (actor), entity, target, action, result, client_ip, server_id, extra]
  - id: SQL-MAS-3C
    method: POST
    path: /api/v1/masters/customer
    request:
      body_ref: backend/app/models/master.py#CustomerCreateRequest
    response:
      schema_ref: backend/app/models/master.py#CustomerCreateResponse
    errors: [MASTER_DUPLICATE, MASTER_INVALID]
    audit: { logger: audit.master, action: create }
  - id: SQL-MAS-3D
    method: DELETE
    path: /api/v1/masters/customer/{gcode}
    query:
      - { name: serverId, type: string, required: true }
    response:
      schema_ref: backend/app/models/master.py#MasterDeleteResponse
    audit: { logger: audit.master, action: delete }
  - id: SQL-MAS-3H
    method: GET
    path: /api/v1/masters/customer/{gcode}/branches
    query:
      - { name: serverId, type: string, required: true }
      - { name: q, type: string, required: false, note: "Gname/Jubun/Oname LIKE %q%" }
      - { name: limit, type: int, default: 100, max: 500 }
      - { name: offset, type: int, default: 0 }
    response:
      schema_ref: backend/app/models/master.py#CustomerBranchListResponse
    note: |
      Seok10 H2_Gbun — 거래처별 지사 목록 (Scode=X). Subu21 Edit106 콤보 데이터 원천.
      path ``gcode`` 는 ``gcode_lookup_variants`` 로 zero-pad/선행0제거 표기를 IN 매칭.
      1차 Hcode=레거시(비-9 거래처 ''), 0건이면 JWT scope_hcode 와 함께 Hcode IN ('',scope) 재조회.
  - id: SQL-MAS-3H-C
    method: POST
    path: /api/v1/masters/customer/{gcode}/branches
    request:
      body_ref: backend/app/models/master.py#CustomerBranchCreateRequest
    response:
      schema_ref: backend/app/models/master.py#CustomerBranchCreateResponse
    errors: [MASTER_INVALID]
    audit: { logger: audit.master, action: create }
  - id: SQL-MAS-3H-U
    method: PATCH
    path: /api/v1/masters/customer/{gcode}/branches/{branch_id}
    request:
      body_ref: backend/app/models/master.py#CustomerBranchUpdateRequest
    response:
      schema_ref: backend/app/models/master.py#CustomerBranchUpdateResponse
    audit: { logger: audit.master, action: update }
  - id: SQL-MAS-3H-D
    method: DELETE
    path: /api/v1/masters/customer/{gcode}/branches/{branch_id}
    query:
      - { name: serverId, type: string, required: true }
    response:
      schema_ref: backend/app/models/master.py#CustomerBranchDeleteResponse
    audit: { logger: audit.master, action: delete }

  - id: SQL-MAS-3B
    method: GET
    path: /api/v1/masters/customer-categories
    query:
      - { name: serverId, type: string, required: true }
      - { name: q, type: string, required: false, note: "Gcode/Gname LIKE %q%" }
      - { name: limit, type: int, default: 100, max: 500 }
      - { name: offset, type: int, default: 0 }
    response:
      schema_ref: backend/app/models/master.py#CustomerCategoryListResponse
  - id: SQL-MAS-3B-C
    method: POST
    path: /api/v1/masters/customer-categories
    request:
      body_ref: backend/app/models/master.py#CustomerCategoryCreateRequest
    response:
      schema_ref: backend/app/models/master.py#CustomerCategoryCreateResponse
    errors: [MASTER_DUPLICATE, MASTER_INVALID]
    audit: { logger: audit.master, action: create }
  - id: SQL-MAS-3B-U
    method: PATCH
    path: /api/v1/masters/customer-categories/{gcode}
    request:
      body_ref: backend/app/models/master.py#CustomerCategoryUpdateRequest
    response:
      schema_ref: backend/app/models/master.py#CustomerCategoryUpdateResponse
    audit: { logger: audit.master, action: update }
  - id: SQL-MAS-3B-D
    method: DELETE
    path: /api/v1/masters/customer-categories/{gcode}
    query:
      - { name: serverId, type: string, required: true }
    response:
      schema_ref: backend/app/models/master.py#MasterDeleteResponse
    audit: { logger: audit.master, action: delete }

  # 도서 (Sobo14)
  - id: SQL-MAS-4
    method: GET
    path: /api/v1/masters/book
    query:
      - { name: serverId, type: string, required: true }
      - { name: q, type: string, required: false, note: "Gcode/Gname/Gisbn LIKE" }
      - { name: gubun, type: string, required: false, note: "도서분류 정확일치 (G4_Gbun.Gcode) — minimal 필터 2026-05" }
      - { name: jubun, type: string, required: false, note: "도서처리 LIKE %jubun% (G4_Book.Jubun)" }
      - { name: excludeShippingStop, type: bool, default: false, note: "출고정지 제외 — IFNULL(Grat9,'') NOT IN ('1','True','true')" }
      - { name: limit, type: int, default: 100, max: 500, note: "DEC-024 표준" }
      - { name: offset, type: int, default: 0 }
