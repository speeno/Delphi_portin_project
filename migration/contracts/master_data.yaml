equivalence:
  read:
    - target: customer.list
      legacy_form: TSobo11
      criteria: "Gcode 정렬, q LIKE, limit/offset 페이지네이션"
    - target: book.list
      legacy_form: TSobo14
      criteria: "Gcode/Gname/Gisbn LIKE 매칭, snake_case 응답"
  write:
    - target: customer.update
      # DEC-RBAC-01: 주소는 권위 사전(SCH-WELOVE-출판-G1_Ggeo) 컬럼 ``Gadd1``/``Gadd2`` 사용.
      legacy_form: TSobo11.UPDATE G1_Ggeo SET Gname/Gtel1/Gtel2/Gpost/Gadd1/Gadd2/Gbigo
      criteria: "변경된 필드만 SET, audit 1줄 JSON 적재"
    - target: book.update
      legacy_form: TSobo14.UPDATE G4_Book SET Gname/Gjeja/Gisbn/Gdang/Gpost
      criteria: "변경된 필드만 SET, audit 1줄 JSON 적재"
    - target: publisher.update
      legacy_form: TSobo17.UPDATE G7_Ggeo SET Gname/Hcode/Chek1/Chek2/Ocode
      criteria: "G7_Ggeo PATCH + audit"
    - target: discount.update
      legacy_form: TSobo39.UPDATE G7_Ggeo SET Gpper|Gpper1|Gpper2|Gpper5 (variant)
      criteria: "SHOW COLUMNS 기반 컬럼 선택, audit"
  audit:
    storage: stdout (audit.master logger)
    fields_required: [timestamp, gcode, entity, target, action, result, client_ip, server_id]

# DEC-019/028 — 레거시 화면 변형 폴더 사실 명시 (UI/로직 1:1 차이는 layout_mappings/Sobo*.md §9 참조).
# 본 섹션은 "1차 모던 화면이 어느 변형까지 흡수했는가" 의 단일 원천. variant 가 발견되면 추가만.
customer_variants:
  - form: Sobo11
    variant_folders: []
    note: "Subu11_* 변형 폴더 0건 — 거래처 마스터는 단일 폼 운영. layout_mappings/Sobo11.md §9."
  - form: Seok10
    variant_folders: []
    note: |
      H2_Gbun 지사 — Gcode 키 표기(예: G1 ``00001`` vs H2 ``1``)는 서비스 IN variants 로 통합.
      목록 GET 0건 시 scope JWT hcode 가 있으면 Hcode IN ('', hcode) 2차 조회(Subu21/Seek06 일부 DB).
  - form: Sobo14
    variant_folders: [Subu14_1]
    note: |
      Subu14_1/Sobo14_1 — Edit201 1개의 도서코드 lookup picker 미니 폼.
      모던 /master/book 의 검색 박스(<Input id="q">)에 흡수.
      layout_mappings/Sobo14.md §9.
  - form: Sobo17
    variant_folders: [Subu17_1]
    note: |
      Subu17_1/Sobo17_1 — 위젯 트리 1:1 동일 (form.json SQL/DataSource 미세 차이만).
      모던 /master/publisher 단일 라우트 흡수. layout_mappings/Sobo17.md §9.
  - form: Sobo38
    variant_folders: [Subu38_1, Subu38_2]
    note: |
      본 폼 Subu38 은 위젯 0개 빈 셸(C3 inbound 우회 — Sobo38_inbound.md 참조).
      도서코드 마스터의 실제 위젯은 변형에 위치 — Subu38_1(T3_Sub82 14컬럼 등록형) /
      Subu38_2(T3_Sub81 10컬럼 + T3_Sub82 3컬럼 검색·등록 통합형). 모던 /master/book-code
      는 Subu38_2.T3_Sub82 의 3컬럼만 1차 노출. layout_mappings/Sobo38.md §9.
  - form: Sobo39
    variant_folders: []
    discount_variants:
      base: { sql_column: Gpper, note: "기본 할인율" }
      v1: { sql_column: Gpper1, fallback: Gpper, note: "Subu39_1 변형 — 컬럼 없으면 Gpper" }
      v2: { sql_column: Gpper2, fallback: Gpper, note: "Subu39_2 변형" }
      v5: { sql_column: Gpper5, fallback: Gpper, note: "Subu39_5 변형" }
    note: |
      모던 단일 UI + ?variant= 쿼리. accelerator Subu39_* 산출물(OOS-MAS-5)은 별도 백로그이나
      API/계약으로 4분기 통합. layout_mappings/Sobo39.md §9.
  # account-menu-fxx-rbac Phase F-1 (2026-05-30) — 누락 3화면(입고처/기타거래처/저자) 정본화.
  # 동일 Sobo## 번호가 WH 빌드와 출판/총판 빌드에서 다른 화면을 가리킨다(빌드 변형).
  # 정본 = 출판/총판 빌드. 차이는 코드 분기 금지 — 본 build_variant 항목 + layout_mappings/Sobo*.md §9 에만.
  - form: Sobo12
    variant_folders: []
    canonical_build: "WeLove_FTP/도서유통-출판/Subu12.dfm"
    canonical_table: G2_Ggwo + G2_Gbun
    license_key: F12   # Menu102 → Seek_Uses('F12'), account-menu-fxx-mapping.md §3
    build_variant:
      wh:        { meaning: "도서(상이 화면)", table: "-",       menu: "-" }
      pub_dist:  { meaning: "입고처관리(정본)", table: "G2_Ggwo", menu: "Menu102/F12" }
    note: |
      Subu12_* 변형 폴더 0건(출판/총판 단일 폼). WH 빌드 Sobo12=도서 와 혼동 금지 — 모던은
      출판/총판 입고처(G2_Ggwo) 정본만 구현. 모던 라우트 /master/inbound-vendor
      (form-registry Sobo12), API /api/v1/masters/inbound-vendors. layout_mappings/Sobo12.md §9.
  - form: Sobo13
    variant_folders: [Subu13_1]
    canonical_build: "WeLove_FTP/도서유통-출판/Subu13.dfm"
    canonical_table: G3_Gjeo + G3_Gbun
    license_key: F13   # Menu103 → Seek_Uses('F13') (웹 임시값 F19 정정)
    build_variant:
      wh:        { meaning: "지역분류(시내+지방)", table: "G1_Ggeo 참조", menu: "Menu103/F17" }
      pub_dist:  { meaning: "저자관리(정본)",       table: "G3_Gjeo",      menu: "Menu103/F13" }
    note: |
      동일 폼번호·상이 화면(빌드 변형). WH 빌드 Sobo13=지역분류(Menu103=F17) ↔ 출판/총판
      Sobo13=저자(G3_Gjeo, Menu103=F13). Subu13_1 은 유통 빌드 지역분류 변형(저자 정본과 별개).
      모던은 출판/총판 저자 정본만 구현. 저자명 컬럼 FieldName=GPOSA(백엔드 Gposa AS gname).
      모던 라우트 /master/author (form-registry Sobo13) — 목록/상세([gcode])/신규(new) 분리 라우트.
      API: /api/v1/masters/authors (목록 GET, 단건 GET/POST/PATCH/DELETE — 본 폼 Panel002
      Edit101~121 전체 필드 AuthorDetail 계약) + /api/v1/masters/author-categories (G3_Gbun CRUD).
      컬럼 차이는 g3_gjeo_adapt.py(SHOW COLUMNS)로 흡수(코드 분기 0). 2026-05-30 상세/구분 폼
      전체 복원 + 4서버 "김" 라이브 검증(analysis/audit/sobo13-author-kim-fidelity.md).
      layout_mappings/Sobo13.md §7/§9.
  - form: Sobo15
    variant_folders: []
    canonical_build: "WeLove_FTP/도서유통-총판/Subu15.dfm"
    canonical_table: G5_Ggeo + G5_Gbun
    license_key: F15   # Menu105 → Seek_Uses('F15') (웹 임시값 F13 정정)
    build_variant:
      wh:        { meaning: "거래처관리-개별", table: "G1_Ggeo + G1_Gbun", menu: "Menu105/F13(WH)" }
      pub_dist:  { meaning: "기타거래처관리(정본)", table: "G5_Ggeo + G5_Gbun", menu: "Menu105/F15" }
    note: |
      핵심 G1 vs G5 빌드 변형. WH 빌드 Sobo15=거래처-개별(INSERT G1_Ggeo) ↔ 출판/총판
      Sobo15=기타거래처(G5_Ggeo, Menu105=F15). 위젯 트리·TabOrder 거의 동일, 차이는 테이블
      prefix(G1↔G5)·캡션뿐 → 데이터/계약 변이로만 흡수(코드 분기 금지). 버튼 캡션 변형
      (추가/등록/삭제). 모던은 출판/총판 G5 정본만 구현.
      구현(2026-05-30): 거래처(Sobo11)와 동형 Ggeo 마스터로 상세 복원. 본 폼 Panel002
      전체 입력(Edit101~127: Gubun/Jubun/Gcode/Ocode/Gname/Gposa/Gnumb/Guper/Gjomo/Gpper/
      Gpost/Gtel1·2/Gfax1·2/Gadd1·2/Grat1~6/Gqut1/Yesno/Gbigo/Name1·2) + 구분 Panel004
      (G5_Gbun) 전체 CRUD. 분리 라우트 /master/etc-customer · /[gcode] · /new.
      API /api/v1/masters/etc-customers(+/{gcode}) · /api/v1/masters/etc-customer-categories
      (+/{gcode}). 스키마 어댑터 g5_ggeo_adapt.py(SHOW COLUMNS 기반 존재 컬럼만 SELECT/PATCH —
      테넌트 DDL 차이 흡수, 코드 분기 0). layout_mappings/Sobo15.md §5/§9.
  # 「Sobo45」 항목 (구 customer_variants) v1.2.0 (2026-04-23) 제거됨.
  # 본 계약은 Sobo45 매핑을 더 이상 보유하지 않음. 청구서관리(Subu45/Subu45_1) 의
  # 변형 정보는 settlement/billing 측 계약(Sobo45_billing) 으로 이관.

# DSN-DEC-12 / ACC-DATA-03 — 공유 DB(chul_09_db·book_07_db 등) 테넌트의 마스터 행 스코프.
# 서비스 코드에 `if 교문사` 같은 분기를 두지 않고, 스코프 결정은 (1) JWT hcode +
# resolve_scope_hcode, (2) tenants_directory hcode_in 격리 키 — 두 데이터 원천으로만 한다.
#
# 미해결 데이터 질문 (라이브 도출 필요 — debug/probe_master_hcode_scope.py)
# ------------------------------------------------------------------------
# 창고형(warehouse_publisher, T3 chul_09) 테넌트는 다수 출판사 Hcode 를 소관할 수 있다.
# 현재 masters list 는 resolve_scope_hcode(ctx) 로 **단일** JWT hcode 만 G4_Book/G1_Ggeo.Hcode
# 에 필터한다(append_hcode_clause). 레거시 Subu14/Subu11 이 단일 Hcode 로만 보여줬다면 정합이나,
# 창고가 여러 Hcode 를 한 화면에서 보여줬다면 단일 필터는 건수를 과소(<< baseline)로 만든다.
# 결정은 다음 수치로만 내린다 (코드 추정 금지 — 사용자 룰):
#   probe_master_hcode_scope --server remote_153 --family chul_09 --hcode <창고hq>
#     · scope_ratio ≈ 1.0  → 단일 Hcode 전건  → 현 동작 정합. 추가 작업 0.
#     · scope_ratio << 1.0 → 창고가 다수 Hcode → tenants_directory hcode_in(집합) 도출 후
#                            masters scope 를 단일 hcode→hcode_in(set) 으로 확장(별도 DEC).
# baseline 정합 기대치: 교문사 books=3437, customers=1289 (debug/baselines/gyomunsa_*.json).
tenant_data_scope:
  - account_family: chul_09
    forms: [Sobo11, Sobo14]
    isolation_source: "tenants_directory.hcode_in (DSN-DEC-12) + JWT hcode (ACC-DATA-03)"
    status: resolved          # 2026-05-30 라이브 도출/검증 완료 (analysis/audit/tenant-db-parity.md §4)
    baseline_ref: debug/baselines/gyomunsa_books.json, debug/baselines/gyomunsa_customers.json
    probe: "debug/probe_master_hcode_scope.py --server remote_153 --family chul_09 --baseline-xref gyomunsa"
    resolution:
      # 교문사 = 단일 Hcode 5019 (엑셀·Id_Logn·마스터 행수 3중 일치). 단일-hcode scope 정합.
      gyomunsa_hcode_in: ["5019"]
      welove3_hcode_in: ["0000", "5000"]
      live_parity: { books: 3437, customers: 1289, key_diff: 0 }
      # 루트 원인 수정: 로그인 hcode 가 JWT 에 누락(servers.yaml auth.query 가 표준 hcode 컬럼 드리프트)
      # → auth_service._row_hcode 가 auth_flags("<hcode>:<gname>") 폴백으로 복원 + servers.yaml 정합.
      # 단일 hcode 정합이므로 hcode_in set 확장(다수 hcode)·별도 DEC 불필요.
      scope_model: single_hcode
      audit_strict: "SHARED_COORD_NO_HCODE_GUARD 0건 (overlay 적용 후)"

# DEC-028 — phase1 contract 차원에서 명시적 비범위(deferred 와 분리: deferred 는 후속 사이클 약속,
# out_of_scope 는 본 contract 가 다루지 않는 영역의 사유 기록).
out_of_scope:
  - id: OOS-MAS-1
    title: Wave D /admin 4 페이지 retrofit
    routes: [/admin, /admin/rbac, /admin/settings]
    reason: |
      어드민(`/admin/*`)은 델파이 신규 어드민 화면(레거시 대응 폼·DFM 산출물 부재).
      DEC-028 retrofit 의 dfm 위젯 ID 매핑 대상이 아님 — admin_web_platform.yaml 별도 contract.
  - id: OOS-MAS-2
    title: Sobo36/37/43 통계 폼
    reason: |
      DEC-023 단일 원천 정책상 통계 화면으로 분리 — Sobo11/14/17/38/39/45 가 phase1 단일 원천.
      통계는 후속 사이클에서 별도 시나리오로 진입.
  - id: OOS-MAS-3
    title: 마스터 INSERT / DELETE (DEC-019 기본)
    reason: |
      기본 정책은 «수정 ON, 삭제 OFF». v1.4.0 예외 — Sobo11/14/17/38(=book)/39 만 POST/DELETE.
      Sobo15 등 나머지는 본 OOS 범위 유지.
  - id: OOS-MAS-4
    title: 자동완성 엔드포인트 (/api/v1/masters/customers, /products)
    reason: |
      C2(거래·출고) contract 의 자동완성 트랙. 본 contract 에서는 영향 0 — 별도 ceil=200
      페이징 정책 유지 (DEC-024 단서). retrofit 스코프 외.
  - id: OOS-MAS-5
    title: Subu39 변형 산출물 (Subu39_1/_2/_5) accelerator 생성
    reason: |
      delphi_porting_accelerator 가 Sobo39 변종 dfm 을 아직 생성하지 못함.
      form-registry.ts 메타와 화면 카드 분석에서 4 변종이 식별되었으나 phase1 retrofit
      은 본 폼 4컬럼만 노출. 변형 산출물 backlog — accelerator 보강 후 layout_mappings/Sobo39.md
      §9 와 본 customer_variants 갱신.

