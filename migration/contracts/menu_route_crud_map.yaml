# ACC-MENU-* ↔ API prefix ↔ Fxx (DEC-RBAC-02 보조)
# DEC-RBAC-04 정합: O→read+write+print, R→read+print, X→deny.
# 수퍼 오버레이로 read-only 등 세분화.
#
# 매핑은 `menu_id_for_api_path` 가 prefix 최장 매칭으로 해석한다.
# 따라서 실제 backend 라우트(masters.py)와 같은 단수/복수형을 함께 등록한다.
version: 1.1.0
method_to_action:
  GET: read
  POST: create
  PUT: update
  PATCH: update
  DELETE: delete
mappings:
  # ACC-MENU-MASTERS-01 거래처 (Sobo11) — F11
  - menu_id: ACC-MENU-MASTERS-01
    api_prefix: /api/v1/masters/customer
    fxx_keys: [F11]
  - menu_id: ACC-MENU-MASTERS-01
