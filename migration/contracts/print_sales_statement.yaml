# 거래명세서 인쇄 — 레거시 삼련(P1-E layout=legacy_triplicate) 프로필
# 코드 분기 금지 — ``sales_statement_print_profile.resolve_profile(server_id)`` 가 본 YAML 만 로드.
# 회원사별 상호·등록번호·은행 등은 ``profiles.<key>`` 를 복제해 수정하거나 ``server_profile_map`` 으로 매핑.

version: "1.0.0"
default_profile_key: default

# 예: remote_138: kyobun_style
server_profile_map: {}

profiles:
  default:
    # layout=default — A4 세로 1장 · 상·하 공급자/공급받는자 블록당 표 행 수 (삼련 table_fixed_rows 와 별도)
    # 흑백 삼련형 밀도에서 두 블록이 한 페이지에 안정적으로 들어가도록 14행을 기본값으로 둔다.
    a4_dual_block_rows_per_page: 14
    table_fixed_rows: 10
    triplicate_labels:
      supplier: "(공급자 보관용)"
      buyer: "(공급받는자 보관용)"
      receipt: "(인수증)"
    section_border_colors:
      supplier: "#0b4f86"
      buyer: "#263f34"
      receipt: "#9c2726"
    # 공급자 우측 법적 블록 — 라벨:값 행 (값 비우면 인쇄 시 빈 칸)
    supplier_legal_rows:
      - { label: "등록번호", value: "102-81-23967" }
      - { label: "상호", value: "(주)교문사" }
      - { label: "성명", value: "류제동" }
      - { label: "사업장주소", value: "경기도 파주시 문발로 116" }
      - { label: "업태", value: "제조" }
      - { label: "종목", value: "출판" }
      - { label: "전화번호", value: "031-955-6111~4" }
      - { label: "팩스", value: "031-955-0955" }
    bank_footer_line: "국민은행 009-25-0000-648 예금주:(주)교문사"
    vertical_return_note: "※반품처 천일화물 파주광탄"
    # 양식지(미리 인쇄된 용지) 인쇄 위치 보정 — 물리 용지 실측값으로 조정.
    # offset: 양수 = 아래/오른쪽 이동(mm). line_row_height_mm: 0=자동(폰트 기반),
    # 양식지 표의 행 간격 실측값(mm)을 지정하면 행 높이를 고정한다.
    # 서버(회원사)별로 용지가 다르면 profiles.<key> 오버라이드 + server_profile_map 으로 분리.
    # 실측 정본: analysis/print_specs/sales_statement_triplicate_form.md
    # (2026-07-04 양식지 사진 계측 — 섹션주기 99mm 앵커, 등방 5.882px/mm)
    preprinted_calibration:
      page_margin_v_mm: 0       # 상하 여백 0 — 3x99.7mm 피치 수용
      section_pitch_mm: 99.7    # 련 반복 주기 (스캔 실측 — 표 하단 이중선 85.3/185.0/284.6)
      section_gap_mm: 0
      offset_top_mm: 1.35       # PDF 실측: 표 상단 32.71 → 물리 34.1mm
      table_margin_left_mm: 3.5 # 컨테이너 좌단(10.06mm)+3.5+translate0.65 = 물리 14.2mm
      offset_left_mm: 0.65
      table_width_mm: 182.9     # 물리 표 폭 (좌 14.2mm ~ 우 197.1mm)
      line_row_height_mm: 4.52  # 데이터 행 (10행 = 45.18mm)
      line_header_height_mm: 6.0   # 표 헤더 행 (실측 5.97)
      field_row_height_mm: 5.73    # 좌측 거래처코드/발행일/거래처명 행
      # DEC-387 (2026-10-07 교문사 실물 사진 보정) — 종전 7.6: 값이 칸 중심보다 ~2mm 아래 → 2mm 위로.
      field_margin_top_mm: 5.6
      # DEC-387 — 종전 31%(12.5mm): 값이 라벨 칸(물리 14.2~34mm) 안에 찍혔다 → 라벨 19.8mm 뒤 값 칸에.
      field_label_width_mm: 20.0
      # DEC-387 — 종전 4.8: 총부수 · 합계가 칸보다 ~4.5mm 아래(한 줄 넘게) → 표 바로 아래로.
      footer_margin_top_mm: 0.3
      # DEC-387 — 종전 0.8(공통 패딩): 부수 · 정가 · 비율 · 금액이 괘선에 붙고 금액이 비고 칸으로 → 1.5mm 왼쪽으로.
      line_num_padding_right_mm: 2.3
      # DEC-389 (2026-10-07 실물 2차) — 「발행일 · 거래처명을 3mm 정도 아래로」: 괘선은 두고 값 글자만 내린다.
      # DEC-389 정정(실물 3차) — 「발행일 3mm 위로, 거래처명 2mm 위로」 → date 3→0 · name 3→1.
      field_row_shift_mm: { code: 0, date: 0, name: 1 }
      # DEC-389 — 「글자를 칸을 넘지 않게 키우고 굵게」: 표 행 4.52mm 에 9pt(3.2mm) · 필드 9pt · 값 전부 700.
      line_font_pt: 9
      field_font_pt: 9
      value_font_weight: 700
      # DEC-389 추가 — 「총부수 · 합계 숫자도 키우고 굵게」: 물리 칸 3.1mm 라 숫자 높이(0.72em) 기준 9.5pt(2.4mm) · 굵기는 value_font_weight.
      footer_font_pt: 9.5
      line_col_widths_mm:       # 도서명은 auto(잔여 75.1)
        "no": 3.8  # 따옴표 필수 — YAML 1.1 에서 no 는 boolean
        shelf: 16.9
        qty: 14.4
        price: 14.15
        rate: 11.05
        amount: 26.0
        note: 21.5
    # 삼련 우측 공급자 블록 도장 오버레이 — 바이너리는 tenant_print_assets, 표시 여부·위치만 YAML.
    # offset 은 공급자블록(.supplier-wrap) 우상단 기준 — 음수=위/오른쪽으로. 스캔 실측(2026-07-05):
    # 도장 중심 x≈198mm·y≈12mm, 지름≈18.5mm(등록번호/상호/성명 상단에 얹힘). 이전 값(2/2/22)은
    # 8mm 아래·2mm 큼(업태/전화 위) 이라 위치 재조정.
    seal_overlay:
      enabled: true
      offset_top_mm: -4.5
      offset_right_mm: -1.5
      width_mm: 18.5
      opacity: 0.92
